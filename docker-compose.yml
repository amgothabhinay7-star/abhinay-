services:
  mongodb:
    image: mongo:5.0
    container_name: ridehub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - ridehub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ridehub-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_SOCKET_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ridehub-network
    command: npm start

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridehub-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://root:password@mongodb:27017/ridehub
      JWT_SECRET: your_jwt_secret_key_here
      JWT_EXPIRE: 7d
      NODE_ENV: development
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ridehub-network
    command: npm run dev

volumes:
  mongo_data:

networks:
  ridehub-network:
    driver: bridge
